<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloud Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          canvas:  '#EAF1FB',
          panel:   '#F5F8FD',
          primary: '#2F6FED',
          primaryDark: '#1E4FC4',
          ink:     '#1E2A3A',
          muted:   '#7C8AA0',
          line:    '#E3E9F3',
          high:    '#EF4B4B',
          medium:  '#F5A524',
          low:     '#22B07D'
        },
        fontFamily: { body: ['Inter', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .progress-bar { transition: width .4s ease; }
  .navItem.active { background: #2F6FED; color: #fff; }
  .navItem.active svg { stroke: #fff; }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px);} to { opacity: 1; transform: translateY(0);} }
  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-thumb { background: #C7D3E6; border-radius: 9999px; }
</style>
</head>
<body class="bg-canvas text-ink min-h-screen">

<div class="min-h-screen p-4 sm:p-6 flex justify-center">
<div class="w-full max-w-6xl bg-panel rounded-2xl shadow-sm border border-line flex overflow-hidden" style="min-height: calc(100vh - 48px);">

  <!-- Sidebar -->
  <aside class="w-56 shrink-0 bg-white border-r border-line flex flex-col p-4">
    <div class="flex items-center gap-2 px-1 py-2 mb-4">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M7 17a4 4 0 0 1 .6-7.96A5.5 5.5 0 0 1 18.3 8.2 4.5 4.5 0 0 1 18 17H7Z" fill="#2F6FED"/>
      </svg>
      <span class="font-semibold text-[15px]">Cloud Task Manager</span>
    </div>

    <nav class="space-y-1 flex-1">
      <button data-view="dashboard" class="navItem w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-muted transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>
      <button data-view="tasks" class="navItem w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-muted transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tasks
      </button>
      <button data-view="archive" class="navItem w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-muted transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9M10 13h4"/></svg>
        Archive
      </button>
      <button data-view="settings" class="navItem w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-muted transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
    </nav>

    <div class="bg-canvas rounded-xl px-3 py-2.5 flex items-center gap-2 mt-4">
      <span id="dockerDot" class="w-2 h-2 rounded-full bg-muted shrink-0"></span>
      <div class="leading-tight">
        <p class="text-[10px] uppercase tracking-wide text-muted font-medium">Docker Status</p>
        <p id="dockerStatus" class="text-xs font-semibold text-muted">Đang kiểm tra…</p>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-5 sm:p-7 overflow-y-auto">
    <div class="flex items-center justify-between mb-5">
      <h1 id="pageTitle" class="text-xl font-semibold">Dashboard</h1>
      <button id="openAdd" class="bg-primary hover:bg-primaryDark text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-1.5 transition-colors">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Add Task
      </button>
    </div>

    <!-- Welcome banner -->
    <div class="bg-blue-50 border border-blue-100 text-primaryDark text-sm rounded-xl px-4 py-3 flex items-center gap-2 mb-6">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Welcome! Dữ liệu được lưu bền vững nhờ Docker Volume (không cần đăng nhập).
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[220px_1fr] gap-5">

      <!-- Stat cards -->
      <div id="statCards" class="space-y-4"></div>

      <!-- Task panel -->
      <div class="bg-white border border-line rounded-xl p-4">
        <div class="flex items-center gap-2 mb-4">
          <div class="relative flex-1">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="searchInput" type="text" placeholder="Add a new task, or search..." class="w-full bg-canvas border border-line rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:border-primary" />
          </div>
        </div>

        <!-- priority filter chips (only shown on Tasks view) -->
        <div id="prioFilters" class="hidden gap-2 mb-3">
          <button data-priority="" class="prioBtn text-xs font-medium px-3 py-1.5 rounded-full border border-line text-muted">Tất cả</button>
          <button data-priority="high" class="prioBtn text-xs font-medium px-3 py-1.5 rounded-full border border-line text-muted">High</button>
          <button data-priority="medium" class="prioBtn text-xs font-medium px-3 py-1.5 rounded-full border border-line text-muted">Medium</button>
          <button data-priority="low" class="prioBtn text-xs font-medium px-3 py-1.5 rounded-full border border-line text-muted">Low</button>
        </div>

        <div id="taskList" class="divide-y divide-line"></div>
        <p id="emptyState" class="hidden text-center text-muted text-sm py-10">Chưa có công việc nào phù hợp.</p>
      </div>
    </div>
  </main>
</div>
</div>

<!-- Add/Edit Modal -->
<div id="modalBackdrop" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden items-center justify-center px-4">
  <div class="bg-white border border-line rounded-xl w-full max-w-md p-5 fade-in">
    <div class="flex items-center justify-between mb-4">
      <h2 id="modalTitle" class="font-semibold text-lg">Thêm công việc</h2>
      <button id="closeModal" class="text-muted hover:text-ink">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="taskForm" class="space-y-3">
      <input type="hidden" id="taskId" />
      <div>
        <label class="text-xs font-medium text-muted">Tiêu đề *</label>
        <input id="fTitle" required maxlength="200" class="mt-1 w-full bg-canvas border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" placeholder="VD: Deploy MongoDB container" />
      </div>
      <div>
        <label class="text-xs font-medium text-muted">Mô tả</label>
        <textarea id="fDesc" rows="3" maxlength="1000" class="mt-1 w-full bg-canvas border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary resize-none" placeholder="Chi tiết công việc (tùy chọn)"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-medium text-muted">Mức ưu tiên</label>
          <select id="fPriority" class="mt-1 w-full bg-canvas border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-medium text-muted">Hạn chót</label>
          <input id="fDue" type="date" class="mt-1 w-full bg-canvas border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" />
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" id="cancelForm" class="flex-1 border border-line rounded-lg py-2 text-sm font-medium hover:bg-canvas transition-colors">Hủy</button>
        <button type="submit" class="flex-1 bg-primary hover:bg-primaryDark text-white rounded-lg py-2 text-sm font-medium transition-colors">Lưu</button>
      </div>
    </form>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
