<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloud Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      screens: { xs: '480px', sm: '640px', md: '768px', lg: '1024px', xl: '1280px', '2xl': '1536px' },
      extend: {
        colors: {
          canvas:  '#EAF1FB',
          panel:   '#F5F8FD',
          primary: '#2F6FED',
          primaryDark: '#1E4FC4',
          ink:     '#1E2A3A',
          muted:   '#7C8AA0',
          line:    '#E3E9F3',
          high:    '#EF4B4B',
          medium:  '#F5A524',
          low:     '#22B07D'
        },
        fontFamily: { body: ['Inter', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .progress-bar { transition: width .4s ease; }
  .navItem.active { background: #2F6FED; color: #fff; }
  .navItem.active svg { stroke: #fff; }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px);} to { opacity: 1; transform: translateY(0);} }
  .toast-in { animation: toastIn .25s ease-out; }
  .toast-out { animation: toastOut .2s ease-in forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(16px);} to { opacity: 1; transform: translateX(0);} }
  @keyframes toastOut { from { opacity: 1; transform: translateX(0);} to { opacity: 0; transform: translateX(16px);} }
  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-thumb { background: #C7D3E6; border-radius: 9999px; }
</style>
</head>
<body class="bg-canvas text-ink min-h-screen">

<div class="min-h-screen flex flex-col md:flex-row">
<div class="w-full bg-panel flex flex-col md:flex-row" style="min-height: 100vh;">

  <!-- Sidebar -->
  <aside class="w-full md:w-56 shrink-0 bg-white border-b md:border-b-0 md:border-r border-line flex flex-row md:flex-col items-center md:items-stretch gap-3 md:gap-0 p-3 md:p-4 overflow-x-auto">
    <div class="flex items-center gap-2 shrink-0 md:px-1 md:py-2 md:mb-4">
      <svg width="24" height="24" viewBox="0 0 26 26" fill="none" class="shrink-0">
        <path d="M7 17a4 4 0 0 1 .6-7.96A5.5 5.5 0 0 1 18.3 8.2 4.5 4.5 0 0 1 18 17H7Z" fill="#2F6FED"/>
      </svg>
      <span class="font-semibold text-sm md:text-[15px] whitespace-nowrap">Cloud Task Manager</span>
    </div>

    <nav class="flex flex-row md:flex-col gap-1 md:space-y-1 md:flex-1 shrink-0">
      <button data-view="dashboard" class="navItem shrink-0 md:w-full flex items-center gap-2 md:gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-muted transition-colors whitespace-nowrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>
      <button data-view="tasks" class="navItem shrink-0 md:w-full flex items-center gap-2 md:gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-muted transition-colors whitespace-nowrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tasks
      </button>
      <button data-view="archive" class="navItem shrink-0 md:w-full flex items-center gap-2 md:gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-muted transition-colors whitespace-nowrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0"><rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9M10 13h4"/></svg>
        Archive
      </button>
      <button data-view="settings" class="navItem shrink-0 md:w-full flex items-center gap-2 md:gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-muted transition-colors whitespace-nowrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
    </nav>

    <!-- Docker status: full card on desktop sidebar -->
    <div class="hidden md:flex bg-canvas rounded-xl px-3 py-2.5 items-center gap-2 mt-4">
      <span id="dockerDot" class="w-2 h-2 rounded-full bg-muted shrink-0"></span>
      <div class="leading-tight">
        <p class="text-[10px] uppercase tracking-wide text-muted font-medium">Docker Status</p>
        <p id="dockerStatus" class="text-xs font-semibold text-muted">Đang kiểm tra…</p>
      </div>
    </div>
    <!-- Docker status: compact pill on mobile top bar -->
    <div class="flex md:hidden items-center gap-1.5 ml-auto shrink-0 bg-canvas rounded-full pl-2 pr-3 py-1.5">
      <span id="dockerDotMobile" class="w-2 h-2 rounded-full bg-muted shrink-0"></span>
      <p id="dockerStatusMobile" class="text-xs font-semibold text-muted whitespace-nowrap">Đang kiểm tra…</p>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-4 sm:p-5 lg:p-7 overflow-y-auto min-w-0">
    <div class="flex items-center justify-between gap-2 mb-4 sm:mb-5">
      <h1 id="pageTitle" class="text-lg sm:text-xl font-semibold">Dashboard</h1>
      <button id="openAdd" class="bg-primary hover:bg-primaryDark text-white text-sm font-medium px-3 sm:px-4 py-2 rounded-lg flex items-center gap-1.5 transition-colors shrink-0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        <span class="hidden xs:inline sm:inline">Add Task</span>
      </button>
    </div>

    <!-- Welcome banner -->
    <div class="bg-blue-50 border border-blue-100 text-primaryDark text-xs sm:text-sm rounded-xl px-3 sm:px-4 py-2.5 sm:py-3 flex items-center gap-2 mb-5 sm:mb-6">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Welcome! Dữ liệu được lưu bền vững nhờ Docker Volume (không cần đăng nhập).</span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[220px_1fr_260px] gap-4 sm:gap-5">

      <!-- Stat cards -->
      <div id="statCards" class="grid grid-cols-1 xs:grid-cols-3 lg:grid-cols-1 gap-3 sm:gap-4"></div>

      <!-- Task panel -->
      <div class="bg-white border border-line rounded-xl p-3 sm:p-4 min-w-0">
        <div class="flex items-center gap-2 mb-4">
          <div class="relative flex-1">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="searchInput" type="text" placeholder="Add a new task, or search..." class="w-full bg-canvas border border-line rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:border-primary" />
          </div>
        </div>

        <!-- priority filter chips (only shown on Tasks view) -->
        <div id="prioFilters" class="hidden gap-2 mb-3 overflow-x-auto">
          <button data-priority="" class="prioBtn shrink-0 text-xs font-medium px-3 py-1.5 rounded-full border border-line text-muted whitespace-nowrap">Tất cả</button>
          <button data-priority="high" class="prioBtn shrink-0 text-xs font-medium px-3 py-1.5 rounded-full border border-line text-muted whitespace-nowrap">High</button>
          <button data-priority="medium" class="prioBtn shrink-0 text-xs font-medium px-3 py-1.5 rounded-full border border-line text-muted whitespace-nowrap">Medium</button>
          <button data-priority="low" class="prioBtn shrink-0 text-xs font-medium px-3 py-1.5 rounded-full border border-line text-muted whitespace-nowrap">Low</button>
        </div>

        <div id="taskList" class="divide-y divide-line"></div>
        <p id="emptyState" class="hidden text-center text-muted text-sm py-10">Chưa có công việc nào phù hợp.</p>
      </div>

      <!-- Calendar panel -->
      <div id="calendarPanel" class="bg-white border border-line rounded-xl p-4 h-fit">
        <div class="flex items-center justify-between mb-3">
          <button id="calPrev" class="w-6 h-6 rounded-md flex items-center justify-center text-muted hover:bg-canvas transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <p id="calMonthLabel" class="text-sm font-semibold"></p>
          <button id="calNext" class="w-6 h-6 rounded-md flex items-center justify-center text-muted hover:bg-canvas transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="grid grid-cols-7 gap-y-1 text-center text-[10px] font-medium text-muted mb-1">
          <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
        </div>
        <div id="calGrid" class="grid grid-cols-7 gap-y-1 text-center text-xs"></div>

        <div class="mt-4 pt-4 border-t border-line">
          <p class="text-[11px] font-semibold text-high mb-2 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-high"></span> Quá hạn
          </p>
          <div id="overdueList" class="space-y-1.5 mb-4"></div>
          <p class="text-[11px] font-semibold text-primary mb-2 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-primary"></span> Sắp tới
          </p>
          <div id="upcomingList" class="space-y-1.5"></div>
        </div>
      </div>
    </div>
  </main>
</div>
</div>

<!-- Add/Edit Modal -->
<div id="modalBackdrop" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden items-center justify-center px-4">
  <div class="bg-white border border-line rounded-xl w-full max-w-md p-5 fade-in">
    <div class="flex items-center justify-between mb-4">
      <h2 id="modalTitle" class="font-semibold text-lg">Thêm công việc</h2>
      <button id="closeModal" class="text-muted hover:text-ink">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="taskForm" class="space-y-3">
      <input type="hidden" id="taskId" />
      <div>
        <label class="text-xs font-medium text-muted">Tiêu đề *</label>
        <input id="fTitle" required maxlength="200" class="mt-1 w-full bg-canvas border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" placeholder="VD: Deploy MongoDB container" />
      </div>
      <div>
        <label class="text-xs font-medium text-muted">Mô tả</label>
        <textarea id="fDesc" rows="3" maxlength="1000" class="mt-1 w-full bg-canvas border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary resize-none" placeholder="Chi tiết công việc (tùy chọn)"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-medium text-muted">Mức ưu tiên</label>
          <select id="fPriority" class="mt-1 w-full bg-canvas border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-medium text-muted">Hạn chót</label>
          <input id="fDue" type="date" class="mt-1 w-full bg-canvas border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" />
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" id="cancelForm" class="flex-1 border border-line rounded-lg py-2 text-sm font-medium hover:bg-canvas transition-colors">Hủy</button>
        <button type="submit" class="flex-1 bg-primary hover:bg-primaryDark text-white rounded-lg py-2 text-sm font-medium transition-colors">Lưu</button>
      </div>
    </form>
  </div>
</div>

<!-- Task Detail Modal -->
<div id="detailBackdrop" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden items-center justify-center px-4">
  <div class="bg-white border border-line rounded-xl w-full max-w-md p-5 fade-in">
    <div class="flex items-start justify-between gap-3 mb-4">
      <div class="min-w-0">
        <p id="detailStatus" class="inline-block text-[11px] font-semibold px-2.5 py-1 rounded-full mb-2"></p>
        <h2 id="detailTitle" class="font-semibold text-lg leading-snug break-words"></h2>
      </div>
      <button id="closeDetail" class="text-muted hover:text-ink shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="mb-4">
      <p class="text-xs font-medium text-muted mb-1">Mô tả</p>
      <p id="detailDesc" class="text-sm text-ink whitespace-pre-wrap break-words"></p>
    </div>

    <div class="space-y-2.5 border-t border-line pt-4">
      <div class="flex items-center justify-between text-sm">
        <span class="text-muted flex items-center gap-1.5">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          Mức ưu tiên
        </span>
        <span id="detailPriority" class="text-[11px] font-semibold text-white px-2.5 py-1 rounded-full"></span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-muted flex items-center gap-1.5">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Hạn chót
        </span>
        <span id="detailDue" class="font-medium"></span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-muted flex items-center gap-1.5">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Ngày tạo
        </span>
        <span id="detailCreated" class="font-medium"></span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-muted flex items-center gap-1.5">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v6h-6"/></svg>
          Cập nhật lần cuối
        </span>
        <span id="detailUpdated" class="font-medium"></span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-muted font-mono text-xs">#ID</span>
        <span id="detailId" class="font-mono text-xs text-muted"></span>
      </div>
    </div>

    <div class="flex gap-2 pt-5">
      <button id="detailDeleteBtn" class="border border-line text-high rounded-lg py-2 px-4 text-sm font-medium hover:bg-red-50 transition-colors">Xóa</button>
      <button id="detailEditBtn" class="flex-1 bg-primary hover:bg-primaryDark text-white rounded-lg py-2 text-sm font-medium transition-colors">Sửa công việc</button>
    </div>
  </div>
</div>

<!-- Toast notifications -->
<div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 items-end max-w-[90vw]"></div>

<script src="/app.js"></script>
</body>
</html>
