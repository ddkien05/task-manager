version: "3.8"

services:
  web:
    build: .
    container_name: task-manager-web
    ports:
      - "80:3000"
    environment:
      - MONGO_URI=mongodb://db:27017/taskdb
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    restart: always

  db:
    image: mongo:6.0
    container_name: task-manager-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
